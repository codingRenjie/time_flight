<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- 不设 theme-color：iOS Safari 在 CSS 阻塞绘制时会用它铺满整屏，只剩深蓝 -->
    <title>Time Pilot 时光机长</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, 'PingFang SC', sans-serif;
      }
      .boot {
        padding: 24px 20px;
        line-height: 1.6;
      }
      .boot small {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="tf-static" style="padding:20px;font-size:22px;line-height:1.5;color:#ffffff">
      Time Pilot 时光机长 已到达手机 · 若这行一直在，说明脚本还没跑起来
    </div>
    <div id="root">
      <p class="boot">正在加载 Time Pilot 时光机长…</p>
    </div>
    <script>
      window.addEventListener(
        'error',
        function (e) {
          var el = document.getElementById('tf-static');
          if (!el) return;
          el.innerHTML =
            '脚本加载失败：' +
            (e.message || '未知错误') +
            '<br><small>请确认地址是 http（不是 https），并关闭内容拦截器。</small>';
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
